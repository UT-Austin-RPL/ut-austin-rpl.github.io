{% if site.rpl_review_preview %}
<aside data-rpl-review-preview aria-label="Website preview" style="padding:.55rem 1rem;background:#fff2e3;color:#5b2b08;text-align:center">
  <strong>Website preview for review</strong> · <a style="color:inherit;text-decoration:underline" href="https://ut-austin-rpl.github.io/">View the published site</a>
</aside>
{% endif -%}
<header class="site-header px2 px-responsive">
  <div class="mt3 wrap">
    <div class="measure">
      <a href="{{ "/" | relative_url }}" class="site-title">{{ site.title }}</a>
      <nav class="site-nav">
        {% include navigation.html %}
      </nav>
      <div class="clearfix"></div>
      {% if site.show_social_icons %}
        {% include social_links.html %}
      {% endif %}
    </div>
  </div>
</header>
